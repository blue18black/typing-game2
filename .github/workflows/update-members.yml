name: メンバー情報を自動更新

on:
  schedule:
    - cron: "0 21 * * *" # 毎日 6:00 (日本時間)
  workflow_dispatch: # Actions タブから手動でも実行できる

permissions:
  contents: write

concurrency:
  group: update-members
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 公式サイトからメンバー情報を取得
        run: node scripts/update-members.mjs

      - name: 変更があればコミット
        run: |
          git add data.js images/auto
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "メンバー情報を自動更新"
          git push
